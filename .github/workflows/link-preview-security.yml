name: Link preview security deterrent

on:
  push:
    branches: [main]
    paths:
      - security.js
      - .github/workflows/link-preview-security.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link security script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '  <script src="security.js"></script>\n'
          if 'src="security.js"' not in s:
              s = s.replace('  <script src="app.js"></script>', tag + '  <script src="app.js"></script>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Enable preview anti-inspection deterrent"
          git push
