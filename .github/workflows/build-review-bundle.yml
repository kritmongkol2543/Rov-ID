name: Build review bundle

on:
  push:
    paths:
      - '.github/workflows/build-review-bundle.yml'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build self-contained HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text()
          css = Path('styles.css').read_text()
          js = Path('app.js').read_text()
          html = html.replace('<link rel="stylesheet" href="styles.css">', '<style>\n' + css + '\n</style>')
          html = html.replace('<script src="app.js"></script>', '<script>\n' + js + '\n</script>')
          Path('bundle.html').write_text(html)
          PY
      - name: Commit bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bundle.html
          git diff --cached --quiet || git commit -m "Build self-contained review bundle"
          git push
