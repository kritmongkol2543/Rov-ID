name: Sync mockup v2 source

on:
  push:
    branches: [main]
    paths:
      - scripts/sync_mockup_v2.py
      - .github/workflows/sync-mockup-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: python scripts/sync_mockup_v2.py
      - name: Commit source sync
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sync responsive member mockup v2"
          git push
