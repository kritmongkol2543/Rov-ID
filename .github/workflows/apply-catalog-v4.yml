name: Apply catalog v4

on:
  push:
    paths:
      - scripts/apply_catalog_v4.py
      - .github/workflows/apply-catalog-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply catalog artwork patch
        run: python scripts/apply_catalog_v4.py
      - name: Syntax check
        run: node --check app.js && node --check api/secure-health.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Diversify RoV product mockup artwork"
            git push
          fi
